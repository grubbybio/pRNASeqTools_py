# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  pRNASeqTools — conda environment file (Linux x86_64 / osx-arm64 通吃)  ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║                                                                          ║
# ║  ⚙️  架构: linux-64 (x86_64) / osx-arm64 (Apple Silicon) / osx-64 通吃  ║
# ║                                                                          ║
# ║  📝  说明: conda/mamba 会根据当前运行平台自动下载对应架构的预编译包，     ║
# ║           同一个 environment.yaml 在哪个平台上创建都能正常工作。          ║
# ║           如果你在旧的 arm64 env 上已经跑通过，直接在 Linux 机器上        ║
# ║           用这份文件创建新 env 即可，无需手动改任何东西。                  ║
# ║                                                                          ║
# ║  🚀  Usage (Linux 64-bit):                                               ║
# ║     conda env create -f environment_linux64.yaml                          ║
# ║     conda activate prnaseqtools                                           ║
# ║     Rscript scripts/checkPackages.R                                       ║
# ║                                                                          ║
# ║  🔧  推荐安装 mamba 加速求解 (Linux):                                     ║
# ║     conda install -n base -c conda-forge mamba                            ║
# ║     mamba env create -f environment_linux64.yaml                          ║
# ║                                                                          ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ── conda 包求解器在某些包有冲突时的处理 ──
# 允许降级 / 允许更新已装包, 避免 "The following specifications were found
# to be incompatible with the existing python installation" 错误
# (linux-64 和 arm64 都会遇到类似的求解器灵活性问题)

name: prnaseqtools
channels:
  - conda-forge
  - bioconda

dependencies:
  # ── Core language runtimes ────────────────────────────────────────────
  - python >=3.9,<3.13
  - perl                          # ShortStack and some helper scripts
  - r-base >=4.5,<4.6
  - r-essentials

  # ── Adapter trimming ─────────────────────────────────────────────────
  - fastp

  # ── Aligners ──────────────────────────────────────────────────────────
  - bowtie
  - bowtie2
  - hisat2 >=2.2.0
  - bismark                       # WGBS bisulfite alignment

  # ── sRNA alignment & analysis ─────────────────────────────────────────
  - shortstack >=3.0

  # ── BAM/SAM processing ────────────────────────────────────────────────
  - samtools >=1.0
  - htslib                        # bgzip, tabix

  # ── Read counting ─────────────────────────────────────────────────────
  - subread                       # featureCounts

  # ── Genome arithmetic ─────────────────────────────────────────────────
  - bedtools

  # ── SRA download (可选) ───────────────────────────────────────────────

  # ── GFF/GTF utilities ────────────────────────────────────────────────
  - gffread
  - gffcompare                     # GTF comparison (RIBO Taper)

  # ── Coverage tracks ──────────────────────────────────────────────────
  - deeptools                     # bamCoverage, bamCompare, bamPEFragmentSize, computeMatrix, plotProfile, plotHeatmap
  - ucsc-bedgraphtobigwig

  # ── Transcript assembly & quantification (RIBO Taper) ───────────────
  # stringtie 已移到 auto_install.py --no-deps 安装
  # 原因: bioconda stringtie 硬锁 htslib <1.23, 与 r-base 4.5 (libdeflate >=1.24) 冲突
  #   auto_install.py 会: conda install -c bioconda --no-deps stringtie
  #- stringtie
  # rsem 由 auto_install.py precheck 用 --no-deps 安装 (bioconda rsem 1.3.3 硬锁 htslib<1.23, 与 r-base 4.5 libdeflate>=1.24 冲突)

  # ── Peak calling ─────────────────────────────────────────────────────
  - macs3                         # MACS3 peak caller (ChIP/ATAC)
  - genrich                       # ChIP-seq / ATAC-seq

  # ── BAM dedup ────────────────────────────────────────────────────────
  - picard-slim                   # MarkDuplicates (ChIP-seq dedup, no r-base dep)
  - openjdk >=17                  # required by picard

  # ── UMI handling ─────────────────────────────────────────────────────
  - umi_tools

  # ── Python libraries (sPARTA degradome + ribo-mode TE statistics) ────
  - numpy
  - scipy

  # ── Bioconductor packages (bioconda, 全平台预编译) ────────────────────
  - bioconductor-deseq2
  - bioconductor-diffbind           # ChIP-seq differential binding (R 4.5 bioconda 构建)
  - bioconductor-txdbmaker          # Bioc 3.20+ makeTxDb*() 新宿主 (GenomicFeatures 1.57 迁出)
  - bioconductor-rhdf5              # HDF5 读写 (Seurat / monocle3 依赖, R 4.5 bioconda 预编译)
  - hdf5                            # HDF5 系统库
  - r-bpcells                       # Single-cell 稀疏矩阵 (monocle3 依赖, bioconda R 4.5 预编译)
  - r-sf                            # 空间矢量数据 (monocle3 Imports, conda-forge R 4.5 预编译, 含 gdal)
  - gdal                            # sf 系统库 (conda-forge, 含 gdal-config)
  - r-ggrastr                       # raster grob (monocle3 Remotes, conda-forge 预编译)
  - r-spdep                         # spatial dependency (monocle3 Imports, conda-forge 预编译)
  - r-seurat                        # Single-cell (conda-forge R 4.5 预编译)
  - r-units                         # 物理量单位处理 (Seurat / monocle3 依赖, conda-forge)
  - bioconductor-rnamodr.ribomethseq
  - bioconductor-complexheatmap   # TE summary heatmap plotting
  - bioconductor-beachmat
  - bioconductor-biocneighbors
  - bioconductor-biocsingular

  # ── Pure R packages (conda-forge / defaults, 全平台预编译) ──────────
  - r-pheatmap
  - r-dplyr
  - r-devtools
  - r-pak                         # R 包管理器 (conda-forge 预编译)
  - r-emmeans                     # Estimated marginal means + paired comparisons (TE stats)
  - r-car                         # ANOVA table type II/III, Levene's test (TE stats)
  - r-multcomp                    # Post-hoc multiple comparison letters (TE stats backup)
  - r-ggpubr                      # Publication-ready stat annotations (TE stats)
  - r-gdtools
  # NMF / ComplexHeatmap 等的依赖链（移到 conda 一次性装完，跳过 pak::pak 慢 bootstrap）
  - r-pkgmaker
  - r-registry
  - r-rngtools
  - r-gridbase
  - r-dendextend
  - r-viridis
  - r-locfit                       # DESeq2 等的局部回归依赖 (conda-forge 预编译)
  - r-ps                           # pak 等的进程管理依赖 (conda-forge 预编译)

  # ── pip-installed tools not on conda ─────────────────────────────────
  - pip
  - pip:
      # stepRNA — Dicer cleavage overhang signature + passenger strand analysis
      # (used by 'risi' mode; requires bowtie2 for local alignment)
      - stepRNA
      # CLIPper — CLIP-seq peak caller
      # (only needed for 'clip' and 'ts' modes)
      # - clipper @ git+https://github.com/YeoLab/clipper.git

# ═══════════════════════════════════════════════════════════════════════════
# Post-install — R packages not available on conda
# ═══════════════════════════════════════════════════════════════════════════
#
# After environment creation, run the bundled R script to install
# remaining packages from Bioconductor and GitHub:
#
#   Rscript scripts/checkPackages.R
#
# This will install:
#   - riboWaltz       (from GitHub — for degradome CRI analysis)
#   - NMF@devel        (from GitHub — required for compatibility)
#   - Seurat           (from GitHub, 也可由 conda r-seurat 预编译)
#   - monocle3         (from GitHub, monocle3 Remotes 需 C++17)
#   - BiocManager, devtools, dplyr (if not already present)
#
# 🔧 Linux 下源码编译 monocle3 / AlgDesign 等需要 C++ 编译器:
#    conda install -n prnaseqtools -c conda-forge c-compiler cxx-compiler
#    或系统级: apt install build-essential / yum groupinstall 'Development Tools'
#
# ═══════════════════════════════════════════════════════════════════════════
# Optional — CLIPper (CLIP-seq modes only)
# ═══════════════════════════════════════════════════════════════════════════
#
# CLIPper is not available on conda. Install manually if you need the
# 'clip' or 'ts' analysis modes:
#
#   git clone https://github.com/YeoLab/clipper.git
#   cd clipper && python setup.py install
#
# ═══════════════════════════════════════════════════════════════════════════
# Notes
# ═══════════════════════════════════════════════════════════════════════════
#
# 1. ShortStack v4 is available on bioconda. The Perl code checks for v3
#    or v4 ("ShortStack.+[34]"). Both are compatible.
#
# 2. featureCounts ships inside the `subread` package. The binary is
#    `featureCounts` (camelCase).
#
# 3. The Python3 rewrite uses only the standard library — no pip-installed
#    Python packages are required for the pipeline itself. numpy/scipy are
#    listed only because the bundled sPARTA.py (degradome mode) imports them.
#
# 4. Reference genome files (~/software/pRNASeqTools/reference/) are NOT
#    included in the environment. They must be obtained from the author and
#    placed in the pRNASeqTools directory.
#
# 5. RIBO Taper (ribo mode) requires the RiboTaper scripts from GitHub.
#    Install manually:
#
#      git clone https://github.com/hsinyenwu/RiboTaper.git ~/RiboTaper_v1.3
#
#    Or specify the path with --ribotaper when running the ribo mode.
#
# 6. linux-64 与 osx-arm64 的主要差异:
#    - 所有 conda-forge / bioconda 包都有 linux-64 预编译 ✓
#    - bioconductor-diffbind 在 linux-64 也有预编译 ✓
#    - monocle3 仍需 GitHub 源码装，但 CXX_STD=C++17 由 checkPackages.R 自动设置
#    - AlgDesign / agricolae / DMRcaller 在 conda-forge 有 linux-64 构建，
#      但为了保证与 arm64 版本行为一致，仍走 BiocManager / install.packages
#      源码装（源码装跨平台更稳定）
#    - MAJIQ patch (CoreIt.hpp 加 #include <algorithm>) 在 linux-64 同样需要
#      (是 C++ 标准库问题，不是 Apple clang 特有的)
#
# 7. linux-64 上如果遇到 htslib/libdeflate 冲突, 修复命令:
#      conda install -c bioconda htslib=1.24 --no-deps
